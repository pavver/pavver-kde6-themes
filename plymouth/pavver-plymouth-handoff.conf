# SDDM replaces plymouth-quit.service, the way GDM does. Plymouth releases the
# display but its last frame stays up until KWin replaces it, instead of a black
# screen for the whole of KWin's startup.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-start.service
# Plymouth still has to stop if SDDM never comes up.
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
# Quitting drops the frame, so it has to wait until KWin owns the display.
ExecStartPost=-/usr/bin/systemd-run --no-block --on-active=5 /usr/bin/plymouth quit --retain-splash
